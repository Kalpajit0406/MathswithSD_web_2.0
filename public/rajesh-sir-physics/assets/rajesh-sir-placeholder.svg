<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f3a" />
      <stop offset="50%" stop-color="#132c52" />
      <stop offset="100%" stop-color="#0b6bcb" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffb703" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="100%" height="100%" rx="32" fill="url(#bgGrad)" />
  <rect x="15" y="15" width="570" height="670" rx="24" fill="none" stroke="#ffb703" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Physics Accents -->
  <circle cx="300" cy="240" r="140" fill="none" stroke="#0b6bcb" stroke-width="2" opacity="0.3"/>
  <ellipse cx="300" cy="240" rx="170" ry="60" fill="none" stroke="#ffb703" stroke-width="2" opacity="0.3" transform="rotate(-25 300 240)"/>
  <ellipse cx="300" cy="240" rx="170" ry="60" fill="none" stroke="#0b6bcb" stroke-width="2" opacity="0.4" transform="rotate(25 300 240)"/>
  
  <!-- Teacher Silhouette Cutout -->
  <g filter="url(#shadow)">
    <!-- Head -->
    <ellipse cx="300" cy="200" rx="65" ry="75" fill="#f4f6fa" />
    <!-- Hair -->
    <path d="M235 185 C235 130 365 130 365 185 C355 155 330 145 300 145 C270 145 245 155 235 185 Z" fill="#0b1f3a" />
    <!-- Glasses -->
    <rect x="255" y="195" width="35" height="25" rx="6" fill="none" stroke="#0b1f3a" stroke-width="4"/>
    <rect x="310" y="195" width="35" height="25" rx="6" fill="none" stroke="#0b1f3a" stroke-width="4"/>
    <line x1="290" y1="205" x2="310" y2="205" stroke="#0b1f3a" stroke-width="4"/>
    <path d="M255 200 L240 195" stroke="#0b1f3a" stroke-width="3"/>
    <path d="M345 200 L360 195" stroke="#0b1f3a" stroke-width="3"/>
    <!-- Gentle Smile -->
    <path d="M285 240 Q300 252 315 240" fill="none" stroke="#0b1f3a" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Neck -->
    <rect x="282" y="270" width="36" height="35" fill="#e2e8f0" />
    <!-- Collar & Tie -->
    <path d="M260 300 L300 340 L340 300 L315 300 L300 315 L285 300 Z" fill="#ffffff" />
    <polygon points="295,315 305,315 308,390 300,405 292,390" fill="#ffb703" />

    <!-- Blazer / Shoulders -->
    <path d="M190 480 C190 350 240 305 300 305 C360 305 410 350 410 480 L420 540 L180 540 Z" fill="#0b1f3a" />
    <!-- Blazer Lapels -->
    <path d="M245 315 L285 410 L270 480" stroke="#0b6bcb" stroke-width="3" fill="none"/>
    <path d="M355 315 L315 410 L330 480" stroke="#0b6bcb" stroke-width="3" fill="none"/>
  </g>

  <!-- Formula Overlay Floating inside graphic -->
  <text x="70" y="100" fill="#ffb703" font-family="'Poppins', sans-serif" font-weight="700" font-size="22" opacity="0.7">E = mc²</text>
  <text x="440" y="120" fill="#64B5F6" font-family="'Poppins', sans-serif" font-weight="700" font-size="20" opacity="0.7">F = ma</text>
  <text x="80" y="580" fill="#90CAF9" font-family="'Poppins', sans-serif" font-weight="700" font-size="20" opacity="0.7">V = IR</text>
  <text x="430" y="560" fill="#ffb703" font-family="'Poppins', sans-serif" font-weight="700" font-size="20" opacity="0.7">λ = h/p</text>

  <!-- Badge Label -->
  <rect x="150" y="590" width="300" height="52" rx="26" fill="#0b1f3a" stroke="#ffb703" stroke-width="2"/>
  <text x="300" y="623" fill="#ffffff" font-family="'Poppins', sans-serif" font-weight="600" font-size="19" text-anchor="middle">
    Rajesh Sir photo
  </text>
</svg>
